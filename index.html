<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>2048 · Merge the Numbers</title>
<style>
* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: #faf8ef; color: #776e65; font-family: system-ui, sans-serif; }
main { width: min(100%, 440px); }
header { display: flex; align-items: center; justify-content: space-between; gap: 16px; }
h1 { font-size: 72px; line-height: 1; margin: 0; letter-spacing: -5px; }
.score { background: #bbada0; color: white; border-radius: 10px; padding: 12px 22px; text-align: center; min-width: 100px; }
.score span { display: block; font-size: 12px; letter-spacing: 2px; color: #eee4da; }
.score strong { font-size: 28px; }
.toolbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin: 24px 0; }
p { line-height: 1.7; }
.toolbar p { margin: 0; font-size: 14px; }
button { flex-shrink: 0; border: 0; border-radius: 8px; padding: 12px 18px; background: #8f7a66; color: white; font: inherit; font-weight: 700; cursor: pointer; }
button:hover { background: #76614f; }
button:focus-visible { outline: 3px solid #edc22e; outline-offset: 4px; }
#board { position: relative; display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; padding: 10px; border-radius: 14px; background: #bbada0; touch-action: none; user-select: none; }
.cell { aspect-ratio: 1; display: grid; place-items: center; border-radius: 8px; background: #cdc1b4; font-size: clamp(24px, 8vw, 46px); font-weight: 800; }
.cell[data-value="2"] { background: #eee4da; }
.cell[data-value="4"] { background: #ede0c8; }
.cell[data-value="8"] { background: #f2b179; color: white; }
.cell[data-value="16"] { background: #f59563; color: white; }
.cell[data-value="32"] { background: #f67c5f; color: white; }
.cell[data-value="64"] { background: #f65e3b; color: white; }
.cell[data-value="128"] { background: #edcf72; color: white; font-size: clamp(22px, 7vw, 38px); }
.cell[data-value="256"] { background: #edcc61; color: white; font-size: clamp(22px, 7vw, 38px); }
.cell[data-value="512"] { background: #edc850; color: white; font-size: clamp(22px, 7vw, 38px); }
.cell[data-value="1024"], .cell[data-value="2048"] { background: #edc22e; color: white; font-size: clamp(19px, 6vw, 32px); box-shadow: 0 0 18px #edc22e55; }
.cell[data-value="4096"] { background: #5c9b88; color: white; font-size: clamp(18px, 5.5vw, 30px); }
.cell[data-value="8192"] { background: #427f90; color: white; font-size: clamp(18px, 5.5vw, 30px); }
.cell[data-value="16384"] { background: #546ba5; color: white; font-size: clamp(16px, 4.8vw, 26px); }
.cell[data-value="32768"] { background: #795aa1; color: white; font-size: clamp(16px, 4.8vw, 26px); }
.cell[data-value="65536"] { background: #a54d80; color: white; font-size: clamp(16px, 4.8vw, 26px); }
.slot { aspect-ratio: 1; border-radius: 8px; background: #cdc1b4; }
.cell { z-index: 1; }
.cell.spawn { animation: appear 150ms ease-out; }
.cell.merged { animation: merge-pop 180ms ease-out; }
@keyframes appear { from { transform: scale(.55); opacity: 0; } to { transform: scale(1); opacity: 1; } }
@keyframes merge-pop { 0%, 100% { transform: scale(1); } 45% { transform: scale(1.14); } }
@media (prefers-reduced-motion: reduce) { .cell.spawn, .cell.merged { animation: none; } }
.hint { margin: 22px 0 0; font-size: 14px; text-align: center; }
dialog { border: 0; border-radius: 18px; padding: 32px; color: #776e65; text-align: center; width: min(340px, 90vw); box-shadow: 0 20px 80px #0003; }
dialog::backdrop { background: #faf8efbb; backdrop-filter: blur(4px); }
dialog h2 { font-size: 30px; margin: 0 0 12px; }
@media (max-width: 360px) { body { padding: 14px; } h1 { font-size: 60px; } #board { gap: 7px; padding: 7px; } }
</style>
</head>
<body>
<main>
  <header>
    <h1>2048</h1>
    <div class="score"><span>SCORE</span><strong id="score" aria-live="polite">0</strong></div>
  </header>
  <div class="toolbar">
    <p>Go beyond <b>2048</b>. Complete the ultimate board!</p>
    <button id="restart" type="button">Restart</button>
  </div>
  <div id="board" role="group" aria-label="2048 game board, four rows and four columns"></div>
  <p class="hint">Use ↑ ↓ ← → arrow keys to move<br>On mobile, swipe across the board<br>Ultimate goal: every power of 2 from 2 to 65,536.</p>
</main>
<dialog id="result" aria-labelledby="resultTitle" aria-describedby="resultText">
  <h2 id="resultTitle"></h2>
  <p id="resultText"></p>
  <button id="playAgain" type="button">Play Again</button>
</dialog>
<script>
"use strict";
const SIZE = 4;
const boardElement = document.getElementById("board");
const scoreElement = document.getElementById("score");
const result = document.getElementById("result");
let board, score, finished;
let touchStart = null;
let moving = false;
let pendingDirection = null;
let generation = 0;
const reducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)");

// Slide and merge a line; each tile can merge only once per move.
function mergeLine(line) {
  const values = line.map((value, source) => ({ value, source }))
    .filter(tile => tile.value !== 0);
  const merged = [], paths = [], merges = [];
  let gained = 0;
  for (let i = 0; i < values.length; i++) {
    const target = merged.length;
    paths.push({ source: values[i].source, target });
    if (i + 1 < values.length && values[i].value === values[i + 1].value) {
      const value = values[i].value * 2;
      merged.push(value);
      gained += value;
      paths.push({ source: values[i + 1].source, target });
      merges.push(target);
      i++;
    } else {
      merged.push(values[i].value);
    }
  }
  while (merged.length < SIZE) merged.push(0);
  return { line: merged, gained, paths, merges };
}

function addRandomTile() {
  const empty = [];
  for (let r = 0; r < SIZE; r++) {
    for (let c = 0; c < SIZE; c++) {
      if (board[r][c] === 0) empty.push([r, c]);
    }
  }
  if (!empty.length) return;
  const [r, c] = empty[Math.floor(Math.random() * empty.length)];
  board[r][c] = Math.random() < 0.9 ? 2 : 4;
  return r * SIZE + c;
}

function canMove() {
  for (let r = 0; r < SIZE; r++) {
    for (let c = 0; c < SIZE; c++) {
      if (board[r][c] === 0) return true;
      if (c + 1 < SIZE && board[r][c] === board[r][c + 1]) return true;
      if (r + 1 < SIZE && board[r][c] === board[r + 1][c]) return true;
    }
  }
  return false;
}

function render(spawned = [], merged = []) {
  boardElement.replaceChildren();
  board.forEach((row, r) => row.forEach((value, c) => {
    const position = r * SIZE + c;
    const slot = document.createElement("div");
    slot.className = "slot";
    slot.style.gridArea = `${r + 1} / ${c + 1}`;
    slot.setAttribute("aria-hidden", "true");
    boardElement.appendChild(slot);
    if (!value) return;
    const cell = document.createElement("div");
    cell.className = "cell" + (spawned.includes(position) ? " spawn" :
      merged.includes(position) ? " merged" : "");
    cell.style.gridArea = slot.style.gridArea;
    cell.dataset.value = value;
    cell.dataset.position = position;
    cell.textContent = value;
    cell.setAttribute("aria-label", `Row ${r + 1}, column ${c + 1}: ${value}`);
    boardElement.appendChild(cell);
  }));
  scoreElement.textContent = score;
}

// The ultimate board contains each power of two exactly once, in any order.
function hasUltimateBoard() {
  const values = board.flat().sort((a, b) => a - b);
  return values.length === SIZE * SIZE &&
    values.every((value, index) => value === 2 ** (index + 1));
}

function checkEnd() {
  if (finished) return;
  const won = hasUltimateBoard();
  if (!won && canMove()) return;
  finished = true;
  document.getElementById("resultTitle").textContent = won ? "🎉 Ultimate Victory!" : "Game Over";
  document.getElementById("resultText").textContent =
    (won ? "You completed the ultimate board: every power of 2 from 2 to 65,536!" : "The board is full. No moves left.") + ` Final score: ${score}`;
  result.showModal();
}

async function move(direction) {
  if (finished) return;
  if (moving) {
    pendingDirection = direction;
    return;
  }
  const next = board.map(row => [...row]);
  const movements = [], mergedPositions = [];
  let gained = 0;
  let changed = false;
  for (let i = 0; i < SIZE; i++) {
    const positions = [];
    for (let j = 0; j < SIZE; j++) {
      if (direction === "left") positions.push([i, j]);
      if (direction === "right") positions.push([i, SIZE - 1 - j]);
      if (direction === "up") positions.push([j, i]);
      if (direction === "down") positions.push([SIZE - 1 - j, i]);
    }
    const original = positions.map(([r, c]) => board[r][c]);
    const merged = mergeLine(original);
    gained += merged.gained;
    positions.forEach(([r, c], j) => {
      if (board[r][c] !== merged.line[j]) changed = true;
      next[r][c] = merged.line[j];
    });
    merged.paths.forEach(({ source, target }) => {
      if (source !== target) movements.push({ from: positions[source], to: positions[target] });
    });
    merged.merges.forEach(target => {
      const [r, c] = positions[target];
      mergedPositions.push(r * SIZE + c);
    });
  }
  if (!changed) {
    checkEnd();
    return;
  }

  moving = true;
  const turn = generation;
  const slots = [...boardElement.querySelectorAll(".slot")];
  const animations = movements.map(({ from: [r, c], to: [tr, tc] }) => {
    const tile = boardElement.querySelector(`[data-position="${r * SIZE + c}"]`);
    // Finish a previous spawn/pop effect before starting the slide.
    tile.getAnimations().forEach(animation => animation.cancel());
    tile.classList.remove("spawn", "merged");
    const source = slots[r * SIZE + c].getBoundingClientRect();
    const target = slots[tr * SIZE + tc].getBoundingClientRect();
    return tile.animate([
      { transform: "translate(0, 0)" },
      { transform: `translate(${target.left - source.left}px, ${target.top - source.top}px)` }
    ], { duration: reducedMotion.matches ? 0 : 150, easing: "cubic-bezier(.2,.7,.3,1)", fill: "forwards" });
  });
  await Promise.all(animations.map(animation => animation.finished.catch(() => {})));
  // Restart invalidates unfinished moves so old callbacks cannot alter a new game.
  if (turn !== generation) return;
  board = next;
  score += gained;
  const spawned = addRandomTile();
  render([spawned], mergedPositions);
  checkEnd();
  moving = false;
  const queued = pendingDirection;
  pendingDirection = null;
  if (queued && !finished) move(queued);
}

function restart() {
  generation++;
  boardElement.getAnimations({ subtree: true }).forEach(animation => animation.cancel());
  moving = false;
  pendingDirection = null;
  if (result.open) result.close();
  board = Array.from({ length: SIZE }, () => Array(SIZE).fill(0));
  score = 0;
  finished = false;
  touchStart = null;
  const spawned = [addRandomTile(), addRandomTile()];
  render(spawned);
}

document.addEventListener("keydown", event => {
  const directions = { ArrowLeft: "left", ArrowRight: "right", ArrowUp: "up", ArrowDown: "down" };
  if (!directions[event.key] || event.ctrlKey || event.metaKey || event.altKey) return;
  event.preventDefault();
  move(directions[event.key]);
});

boardElement.addEventListener("pointerdown", event => {
  if (!event.isPrimary || event.button !== 0) return;
  touchStart = { x: event.clientX, y: event.clientY, id: event.pointerId };
  boardElement.setPointerCapture(event.pointerId);
});
boardElement.addEventListener("pointerup", event => {
  if (!touchStart || touchStart.id !== event.pointerId) return;
  const dx = event.clientX - touchStart.x;
  const dy = event.clientY - touchStart.y;
  touchStart = null;
  if (Math.max(Math.abs(dx), Math.abs(dy)) < 24) return;
  move(Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? "right" : "left") : (dy > 0 ? "down" : "up"));
});
boardElement.addEventListener("pointercancel", () => { touchStart = null; });
result.addEventListener("cancel", event => event.preventDefault());
document.getElementById("restart").addEventListener("click", restart);
document.getElementById("playAgain").addEventListener("click", restart);
restart();
</script>
</body>
</html>
